# AI-DLC configuration
#
# Copy this file to `aidlc.config.yaml` in your project root (or run `/aidlc-init`,
# which will generate it for you by asking a few questions).
#
# All AIDLC skills read these values instead of hardcoded organisation details.
# Leave a value blank ("") if you don't use that backend/integration.

# Which documentation backend to use by default: gitlab | linear | confluence
backend:
  default: "gitlab"

# Atlassian (Jira + Confluence) connection
atlassian:
  # Your Atlassian cloud id or site host, e.g. "yourcompany.atlassian.net"
  cloudId: ""            # -> <ATLASSIAN_CLOUD_ID>

# Confluence documentation backend
confluence:
  spaceKey: ""           # e.g. "ENG"        -> <CONFLUENCE_SPACE_KEY>
  # Page id of the "Features Index" registry page.
  # Leave blank on first run; /aidlc-intent will create it and you can paste the id here.
  featureIndexPageId: "" # -> <FEATURE_INDEX_PAGE_ID>

# Jira work tracking
jira:
  projectKey: ""         # default Jira project key, e.g. "PROJ"
  # Issue types created when the AI-DLC hierarchy is transferred to Jira.
  # Defaults use stock Jira types (no custom types needed): Epic → Story → Task.
  issueTypes:
    epic: "Epic"
    grouping: "Story"    # the work-item that groups tasks (formerly the "Sprint" type)
    leaf: "Task"         # implementation item under each grouping
  # How the leaf attaches to its grouping:
  #   "link"   -> leaf is parented to the Epic and joined to its grouping via an issue link.
  #               REQUIRED in Jira when grouping+leaf are the same hierarchy level (Story+Task).
  #   "parent" -> leaf is a native child of the grouping (use only if your leaf type is a
  #               valid child of the grouping type).
  leafAttach: "link"
  linkType: "Relates"    # issue-link type used when leafAttach is "link" (present in every Jira project)

# Azure DevOps work tracking (used when the work tracker is ADO instead of Jira)
ado:
  project: ""            # ADO project name
  # ADO Agile process nests Task natively under User Story, so leafAttach is "parent".
  issueTypes:
    epic: "Epic"
    grouping: "User Story"
    leaf: "Task"
  leafAttach: "parent"

# GitLab documentation backend (the ai-dlc-docs repo, NOT your source code repo)
gitlab:
  docsRepoUrl: ""        # e.g. "https://gitlab.com/org/group/ai-dlc-docs"   -> <GITLAB_DOCS_REPO_URL>
  docsRepoSsh: ""        # e.g. "git@gitlab.com:org/group/ai-dlc-docs.git"    -> <GITLAB_DOCS_REPO_SSH>
  docsPath: ""           # local checkout path (also settable via AIDLC_DOCS_PATH env var)

# Linear documentation/work backend
linear:
  teamKey: ""            # e.g. "ENG"

# Optional reference links surfaced in planning docs
links:
  performanceStandards: "" # e.g. "https://yourcompany.atlassian.net/wiki/.../Performance+Standards" -> <PERFORMANCE_STANDARDS_URL>

# Leaf work-item (Story/Task/Bolt) description template used in /aidlc-verify Phase 6 transfer.
# Renders the rich 12-section GP-style description (see references/work-item-template.md).
# Set enabled:false to restore the legacy minimal description (Behaviour + AC + link, no labels).
workItemTemplate:
  enabled: true

  # Label set applied to every leaf work item. Tokens in <angle brackets> are resolved per
  # item at transfer time; literal strings are applied as-is.
  #   <leafType>    = jira.issueTypes.leaf, lower-cased (story|task|bolt)
  #   <featureId>   = e.g. FI-0001
  #   <productSlug> = e.g. bench-resource-tracker
  #   <layer>       = backend|frontend|fullstack|platform (from sprint type)
  #   <epicId>      = e.g. U01
  #   <sprintNum>   = sprint grouping number
  # Literal strings (aidlc, NoQA) are applied as-is; <tokens> are resolved per item.
  # <layer> is derived per ticket from its files/behaviour (backend|frontend|fullstack|platform).
  labels:
    - aidlc
    - NoQA
    - "<leafType>"
    - "<featureId>"
    - "<productSlug>"
    - "<layer>"
    - "<epicId>"
    - "sprint-<sprintNum>"

  # Estimation written to each leaf from the task's Fibonacci size.
  estimation:
    mode: both              # points | hours | both
    # Fibonacci size -> Original Estimate hours (used when mode is hours|both)
    pointsToHours: { 1: 2, 2: 4, 3: 8, 5: 16, 8: 24, 13: 40 }

  # Human-readable product slug used in labels and the References block.
  productSlug: bench-resource-tracker

  # References block deep-links. Any key left blank is omitted from the rendered References
  # section. Normally resolved from BackendContext; set here to override.
  references:
    featureUrl: ""          # Intent / Feature page
    designUrl: ""           # Design page
    adrsUrl: ""             # ADR page
    businessRulesUrl: ""    # Business Rules page (omit if project has none)
    boardUrl: ""            # Jira board backlog URL

  # Description body format. "markdown" => create/edit issues with contentFormat:"markdown".
  # Never wrap the whole body in an ADF codeBlock.
  descriptionFormat: markdown
